
<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración general del documento -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis turnos · AXIS</title>

  <!-- Ícono que aparece en la pestaña del navegador -->
  <link rel="icon" href="img/logo.png">

  <!-- Fuente utilizada en toda la plataforma -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hoja de estilos principal -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<!-- Identifica la página actual para que JavaScript ejecute la lógica correspondiente -->
<body data-page="turnos">

  <!-- Barra superior con el logo y los datos del usuario -->
  <header class="topbar">
    <a class="brand" href="panel.html">
      <img src="img/logo.png" alt="">AXIS
    </a>

    <div class="user">
      <!-- El avatar y el nombre del usuario se completan desde JavaScript -->
      <div class="avatar" id="av"></div>
      <span class="n" id="un"></span>

      <!-- Enlace para cerrar la sesión y volver al inicio -->
      <a href="index.html" id="salir" style="color:#fff;font-size:.8rem;margin-left:.8rem">Salir</a>
    </div>
  </header>

  <div class="layout">

    <!-- Menú lateral de navegación del paciente -->
    <aside class="sidebar">
      <div>
        <h2>PACIENTE</h2>

        <nav aria-label="Principal">
          <a href="panel.html"><span aria-hidden="true">▦</span>Inicio</a>
          <a href="nuevo-turno.html"><span aria-hidden="true">＋</span>Nuevo turno</a>

          <!-- active indica visualmente cuál es la sección actual -->
          <a href="mis-turnos.html" class="active" aria-current="page"><span aria-hidden="true">▤</span>Mis turnos</a>

          <a href="perfil.html"><span aria-hidden="true">☺</span>Mi perfil</a>

          <!-- Abre WhatsApp en una pestaña nueva con un mensaje inicial -->
          <a href="https://wa.me/5491100000000?text=Hola%20AXIS%2C%20quiero%20agendar%20un%20turno" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">💬</span>Chatbot WA</a>
        </nav>
      </div>

      <!-- Información institucional y legal -->
      <footer>
        © 2026 AXIS — Todos los derechos reservados<br>
        Plataforma protegida bajo Ley 25.326
      </footer>
    </aside>

    <!-- Contenido principal de la página de turnos -->
    <main class="main">

      <!-- Encabezado de la sección y acceso directo para solicitar un nuevo turno -->
      <div class="tabs">
        <h1 style="margin:0 auto 0 0">Mis turnos</h1>
        <a class="btn primary" href="nuevo-turno.html">📅 Nuevo turno</a>
      </div>

      <!-- Filtros para consultar los turnos según su estado o fecha -->
      <div class="tabs">
        <!-- data-v indica a JavaScript qué tipo de turnos debe mostrar -->
        <button class="tab on" data-v="proximos">Próximos</button>
        <button class="tab" data-v="historial">Historial</button>
        <button class="tab" data-v="cancelados">Cancelados</button>
      </div>

      <!-- JavaScript carga aquí los turnos del paciente según el filtro seleccionado -->
      <div id="lista"></div>
    </main>
  </div>

  <!-- Archivo JavaScript encargado de consultar la API, aplicar los filtros y actualizar el listado -->
  <script src="js/app.js"></script>
</body>
</html>
